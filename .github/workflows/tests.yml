name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install rclone (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Install rclone (Windows)
        if: runner.os == 'Windows'
        run: choco install rclone -y --no-progress
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest -v
