name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install rclone (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip --output rclone.zip
          unzip -q rclone.zip
          sudo install -m 755 rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone
      - name: Install rclone (Windows)
        if: runner.os == 'Windows'
        run: choco install rclone -y --no-progress
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare application automatically
        run: python bootstrap.py --setup-only
      - name: Smoke-test Windows launcher
        if: runner.os == 'Windows'
        run: .\get-from-yadisk.cmd --help
      - name: Run tests
        run: python -m unittest -v
